pre-commit:
  parallel: false
  commands:
    eslint:
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files} || echo "❌ ESLint failed! Fix the errors above." && exit 1
    prettier:
      glob: "*.{js,ts,tsx,css,json,md}"
      run: npx prettier --check {staged_files} || echo "❌ Prettier failed! Run npx prettier --write {staged_files}" && exit 1
    typecheck:
      run: npm run typecheck || echo "❌ TypeScript typecheck failed! Fix the errors above." && exit 1
